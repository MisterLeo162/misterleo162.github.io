<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisation du document - Mon Portfolio</title>
    <link rel="stylesheet" href="style-docs.css">
    <style>
        /* Styles spécifiques pour le visualiseur */
        .viewer-container {
            max-width: 1000px;
            margin: 40px auto;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
        }
        
        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .viewer-header h2 {
            margin: 0;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-download {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
        }

        .btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 120, 215, 0.4);
            color: white;
        }

        /* La zone qui affiche le PDF */
        .pdf-frame {
            width: 100%;
            height: 75vh; /* Prend 75% de la hauteur de l'écran */
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background-color: #eee; /* Fond gris pendant le chargement */
        }

        @media screen and (max-width: 600px) {
            .viewer-header { flex-direction: column; align-items: flex-start; }
            .pdf-frame { height: 60vh; }
        }
    </style>
</head>
<body>

    <header>
        <a href="Repertoire-documentations.html" class="logo">Visualiseur</a>
        <div class="nav-controls">
            <a href="Repertoire-documentations.html" class="btn-back">← Retour aux documents</a>
            <button id="theme-toggle">🌙 Sombre</button>
        </div>
    </header>

    <main>
        <div class="viewer-container fade-in">
            
            <div class="viewer-header">
                <h2>📄 Documentation d'installation d'Apache2 sur une Ubuntu Server.</h2>
                
                <a href="Documentation d'installation d'Apache2 sur UnbuntuServer - Leo Bacouillard-Rociola-1.pdf" download="Documentation du serveur GLPI avec LDAP AD.pdf" class="btn-download">
                    ⬇️ Télécharger le fichier
                </a>
            </div>

            <iframe src="Documentation d'installation d'Apache2 sur UnbuntuServer - Leo Bacouillard-Rociola-1.pdf" class="pdf-frame" title="Visualisation du PDF">
                <p>Votre navigateur ne supporte pas l'affichage des PDF. <a href="Documentation du serveur GLPI avec LDAP AD.pdf">Téléchargez-le ici</a>.</p>
            </iframe>

        </div>
    </main>

    <script src="script-docs.js"></script>
</body>
</html>
